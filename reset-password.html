<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Définir votre mot de passe — VISUUUM 224</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #E8622A;
    --dark:   #111111;
    --bg:     #F5F4F0;
    --border: rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 440px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.12);
  }
  .card-header {
    background: var(--dark);
    padding: 28px 32px;
    text-align: center;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--orange);
    letter-spacing: 2px;
  }
  .tagline {
    font-size: 11px;
    color: rgba(255,255,255,.4);
    letter-spacing: .12em;
    margin-top: 4px;
    text-transform: uppercase;
  }
  .card-body { padding: 32px; }
  h1 {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 13px;
    color: #777;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .email-chip {
    display: inline-block;
    background: rgba(232,98,42,.08);
    color: var(--orange);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
    word-break: break-all;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .field input:focus { border-color: var(--orange); }
  .hint {
    font-size: 11px;
    color: #aaa;
    margin-top: 6px;
  }
  button.submit {
    width: 100%;
    padding: 14px;
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
    margin-top: 8px;
  }
  button.submit:hover { background: #c9541f; }
  button.submit:disabled { opacity: .6; cursor: not-allowed; }
  .msg {
    font-size: 13px;
    margin-top: 14px;
    text-align: center;
    display: none;
  }
  .msg.error { color: #A32D2D; }
  .msg.success { color: #2E7D46; }

  .state-icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin: 0 auto 18px;
  }
  .state-icon.ok { background: rgba(46,125,70,.1); color: #2E7D46; }
  .state-icon.ko { background: rgba(163,45,45,.1); color: #A32D2D; }

  .center { text-align: center; }
  .redirect-note {
    font-size: 12px;
    color: #aaa;
    margin-top: 18px;
  }
  .back-link {
    display: inline-block;
    margin-top: 18px;
    color: var(--orange);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(232,98,42,.2);
    border-top-color: var(--orange);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="logo">VISUUUM 224</div>
      <div class="tagline">Le visuel des entreprises</div>
    </div>

    <div class="card-body" id="cardBody">
      <div class="center" id="loadingState">
        <div class="spinner"></div>
        <p style="font-size:13px;color:#888;">Vérification du lien en cours...</p>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, verifyPasswordResetCode, confirmPasswordReset }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzNyy8ZjnQxVWE4XKmHW3ySwz0kVr9_ZM",
    authDomain: "visuuum224-cd187.firebaseapp.com",
    projectId: "visuuum224-cd187",
    storageBucket: "visuuum224-cd187.firebasestorage.app",
    messagingSenderId: "73556593240",
    appId: "1:73556593240:web:b9e1371f95adbb3301582d"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const params  = new URLSearchParams(window.location.search);
  const mode    = params.get('mode');
  const oobCode = params.get('oobCode');
  const body    = document.getElementById('cardBody');

  const HOME_URL = 'https://visuuum224.com';

  function renderError(message) {
    body.innerHTML = `
      <div class="center">
        <div class="state-icon ko">✕</div>
        <h1>Lien invalide</h1>
        <p class="subtitle">${message}</p>
        <a class="back-link" href="${HOME_URL}">← Retour à l'accueil</a>
      </div>
    `;
  }

  function renderForm(email) {
    body.innerHTML = `
      <h1>Définissez votre mot de passe</h1>
      <p class="subtitle">Choisissez un nouveau mot de passe pour accéder à votre espace entreprise sur VISUUUM 224.</p>
      <div class="email-chip">✉️ ${email}</div>

      <div class="field">
        <label>Nouveau mot de passe</label>
        <input type="password" id="pw1" placeholder="Au moins 6 caractères" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirmer le mot de passe</label>
        <input type="password" id="pw2" placeholder="Ressaisissez le mot de passe" autocomplete="new-password">
      </div>

      <button class="submit" id="submitBtn">✦ Définir mon mot de passe</button>
      <div class="msg" id="formMsg"></div>
    `;

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      const msgEl = document.getElementById('formMsg');
      const btn = document.getElementById('submitBtn');

      msgEl.style.display = 'none';

      if (pw1.length < 6) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
        msgEl.style.display = 'block';
        return;
      }
      if (pw1 !== pw2) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Les deux mots de passe ne correspondent pas.';
        msgEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ Enregistrement...';

      try {
        await confirmPasswordReset(auth, oobCode, pw1);
        renderSuccess();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = '✦ Définir mon mot de passe';
        msgEl.className = 'msg error';
        msgEl.textContent = "Ce lien a peut-être expiré. Refaites une demande depuis le site.";
        msgEl.style.display = 'block';
      }
    });
  }

  function renderSuccess() {
    let seconds = 4;
    body.innerHTML = `
      <div class="center">
        <div class="state-icon ok">✓</div>
        <h1>Mot de passe défini !</h1>
        <p class="subtitle">Vous pouvez maintenant vous connecter à votre espace entreprise sur VISUUUM 224.</p>
        <a class="back-link" href="${HOME_URL}">Aller au site maintenant →</a>
        <p class="redirect-note" id="redirectNote">Redirection automatique dans ${seconds}s...</p>
      </div>
    `;
    const noteEl = document.getElementById('redirectNote');
    const interval = setInterval(() => {
      seconds -= 1;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = HOME_URL;
      } else {
        noteEl.textContent = `Redirection automatique dans ${seconds}s...`;
      }
    }, 1000);
  }

  // ── Point d'entrée ──
  (async function init() {
    if (mode !== 'resetPassword' || !oobCode) {
      renderError("Ce lien n'est pas valide. Vérifiez que vous avez bien copié l'intégralité du lien reçu par email.");
      return;
    }
    try {
      const email = await verifyPasswordResetCode(auth, oobCode);
      renderForm(email);
    } catch (err) {
      renderError("Ce lien a expiré ou a déjà été utilisé. Merci de refaire une demande depuis le site.");
    }
  })();
</script>

</body>
</html>
